name: Build Gin Installers (Mac & Windows)
run-name: Gin installers · ${{ inputs.source-ref || github.ref_name }}

on:
  push:
    tags:
      - "v*-gin.*"
  workflow_dispatch:
    inputs:
      source-ref:
        description: "Gin tag or branch to package"
        required: true
        default: "v0.10.1-gin.6"
        type: string
      mac-only:
        description: "Build Apple Silicon macOS installer only"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: gin-installers-${{ inputs.source-ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source-ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Validate versions and pin source commit
        id: source
        run: node scripts/release-source.mjs
      - name: Read package version
        id: version
        run: |
          VERSION=$(node -p "require('./apps/desktop/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

  desktop:
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      # Personal sharing builds use ad-hoc signing; no upstream certificate required.
      release-tag: ""
      mac-only: ${{ inputs.mac-only == true }}

  publish:
    needs: [prepare, desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      MAC_ONLY: ${{ inputs.mac-only == true && 'true' || 'false' }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: neoread-*
          path: release
          merge-multiple: true
      - name: Verify complete installer set and generate checksums
        run: node scripts/release-assets.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: neoread-checksums
          path: release/SHA256SUMS.txt
      - name: Publish or update GitHub Release with installers
        if: github.event_name == 'push' || startsWith(inputs.source-ref, 'v')
        run: |
          node -e '
            const fs = require("node:fs");
            const v = process.env.VERSION;
            const lines = [
              `## NeoRead ${v}（Gin 个人版）`,
              "",
              "### 本次更新重点",
              "- **新增无干扰「逐段对照」单栏阅读模式（PDF / EPUB 通用）**：在顶部切换「仅原文 / 原文译文 / 逐段对照 / 仅译文」，单栏交替呈现一段原文与一段译文，去除段落悬浮框与悬浮按钮；支持单栏「适配页面与文字」缩放，完整保留原文多子图组合与图表并支持点击放大，原文段与译文段均可直接划词批注。",
              "- **文末图表「角落小窗悬浮对照」与经济学 `(Author, Year)` 文献引用定位**：点击正文或译文中的图表编号（`Figure 2`、`Table 1`、`Figure A.9`、`表 A.27`）或作者年份引用（`Hayek 1978`、`North et al. 1990`、`Sun和Abraham（2021）`），直接在右下角弹出可移动、缩放、调大小的非模态原图/原表或参考文献悬浮小窗，边读正文边对照图表。",
              "- **精准识别 Working Paper 等预印本的作者、年份与出处**：针对无 DOI/arXiv 的工作论文（LaTeX 初稿、NBER、SSRN、CEPR、IZA 等预印本），自动从首页版面、作者单位脚注与 PDF 元信息中精准提取多位作者顺序、最新修订年份与 `Working Paper` 出处。",
              "- **译文 PDF 导出支持「纯中文译文」与「逐段原文+译文」双版式**：既可导出不含任何英文原文的纯中文单栏 PDF，也可导出逐段中英对照单栏 PDF，均完整保留原论文图表、矢量公式、双向批注（高亮/下划线/笔记/AI 问答）与目录书签。",
              "- **三处快捷导出入口**：阅读界面右上角顶栏「导出」按钮；笔记栏「导出」；论文库与图书库右键菜单。",
              "",
              "---",
              "",
              "### 安装包说明（新安装 & 旧版更新通用）",
              "",
              "| 平台 | 安装包文件 | 说明 |",
              "| :--- | :--- | :--- |",
              `| **macOS（Apple Silicon M 系列）** | \`NeoRead-${v}-mac-arm64.dmg\` | 新装与覆盖升级通用 |`,
              `| **Windows（64 位 x64）** | \`NeoRead-${v}-win-x64.exe\` | 新装与覆盖升级通用 |`,
              "",
              "#### 1. 之前安装过旧版的用户（更新升级，数据 100% 保留）",
              "- **切勿删除书库或配置目录**，也无需先卸载旧版；所有文献、已保存译文、高亮批注、论文笔记、AI 对话、API 与代理配置均自动继承。",
              "- **macOS 升级**：先完全退出正在运行的 NeoRead → 打开 `.dmg` → 将 `NeoRead.app` 拖入 `Applications`（应用程序）并点击 **「替换」**（若曾手动将旧版改名为 `NeoReader.app`，请删除旧副本保留新 `NeoRead.app`）→ 若首次打开提示“未验证开发者”，前往 **系统设置 → 隐私与安全性 → 仍要打开**（或终端运行 `xattr -cr /Applications/NeoRead.app`）。",
              "- **Windows 升级**：先完全退出正在运行的 NeoRead → 直接双击运行 `.exe` 安装包 → 保持原安装路径完成覆盖安装即可。",
              "",
              "#### 2. 从未安装过的新用户（首次安装）",
              "- **macOS 新装**：双击打开 `.dmg` → 将 `NeoRead.app` 拖入 `Applications` → 首次启动若遇系统安全提示，在 **系统设置 → 隐私与安全性** 点击 **仍要打开** → 启动后自动创建本地书库并开启新手引导。",
              "- **Windows 新装**：双击运行 `.exe`（若遇 SmartScreen 提示，点击 **更多信息 → 仍要运行**）→ 选择安装位置完成安装 → 自动创建桌面/开始菜单快捷方式并注册 PDF/EPUB 打开方式。",
            ];
            fs.writeFileSync("release-notes.md", lines.join("\n") + "\n");
          '
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "NeoRead ${VERSION}" --notes-file release-notes.md --prerelease
          else
            gh release create "$TAG" --target "$SOURCE_SHA" --title "NeoRead ${VERSION}" --notes-file release-notes.md --prerelease
          fi
          RELEASE_TAG="$TAG" node scripts/release-assets.mjs --upload
